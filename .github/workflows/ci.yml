name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  GO_VERSION: '1.24'
  NODE_VERSION: '20'

jobs:
  # =============================================================================
  # Go Backend - Lint, Test, Build
  # =============================================================================
  go-lint:
    name: Go Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest
          args: --timeout=5m

  go-test:
    name: Go Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: qlrf_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run migrations
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/qlrf_test?sslmode=disable
        run: |
          go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@latest
          migrate -path migrations -database "$DATABASE_URL" up

      - name: Run tests
        env:
          RF_DATABASE_URL: postgres://postgres:postgres@localhost:5432/qlrf_test?sslmode=disable
          RF_ENV: test
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.out
          fail_ci_if_error: false

  go-build:
    name: Go Build
    runs-on: ubuntu-latest
    needs: [go-lint, go-test]
    strategy:
      matrix:
        service: [api, connectors, drift, orchestrator]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build ${{ matrix.service }}
        run: |
          CGO_ENABLED=0 go build -ldflags="-s -w" -o bin/${{ matrix.service }} ./services/${{ matrix.service }}/cmd/${{ matrix.service }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-binary
          path: bin/${{ matrix.service }}
          retention-days: 7

  # =============================================================================
  # Frontend - Lint, Build
  # =============================================================================
  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/control-tower
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ui/control-tower/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: [frontend-lint]
    defaults:
      run:
        working-directory: ui/control-tower
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ui/control-tower/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.com
          NEXT_PUBLIC_ORCHESTRATOR_URL: https://api.example.com
        run: npm run build

  # =============================================================================
  # Frontend E2E Tests
  # =============================================================================
  frontend-e2e:
    name: Frontend E2E Tests
    runs-on: ubuntu-latest
    needs: [frontend-lint]
    # ADVISORY / non-blocking while E2E-001 is in progress. This job now boots
    # the full stack (docker compose) and seeds deterministic data so the specs
    # run for real, but the suite is being hardened page-by-page (overview
    # first), so its result must not block the pipeline yet. Remove
    # continue-on-error and restore the ci-complete gate once the seeded suite
    # is reliably green across the targeted pages.
    # Tracking: docs/E2E-001-deterministic-fullstack-e2e.md
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ui/control-tower/package-lock.json

      # Boot API (:8080), orchestrator (:8083) and the frontend (:3000) plus their
      # dependencies. The compose `migrate` service applies migrations; the `ui`
      # image is built with NEXT_PUBLIC_API_URL pointing at :8080, and the API
      # runs with RF_DEV_MODE=true so it accepts the Clerk-authenticated session
      # and resolves the seeded default org.
      #
      # We do NOT `--wait` here: the ui container's wget-based healthcheck is
      # unreliable in CI even when Next is serving. depends_on still gates ui on
      # a healthy api/orchestrator; readiness is then probed from the runner.
      - name: Start full stack (docker compose)
        env:
          RF_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          RF_CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          RF_LLM_API_KEY: ${{ secrets.RF_LLM_API_KEY }}
        run: docker compose up -d --build ui

      - name: Wait for stack readiness
        run: |
          wait_for() {
            for _ in $(seq 1 60); do
              if curl -sf -o /dev/null "$1"; then echo "ready: $1"; return 0; fi
              sleep 5
            done
            echo "NOT ready after 5m: $1"
            return 1
          }
          wait_for http://localhost:8080/healthz || { docker compose logs api --no-color --tail=80; exit 1; }
          wait_for http://localhost:8083/health  || { docker compose logs orchestrator --no-color --tail=80; exit 1; }
          wait_for http://localhost:3000         || { docker compose logs ui --no-color --tail=80; exit 1; }

      - name: Seed deterministic E2E fixture
        env:
          RF_DATABASE_URL: postgres://postgres:postgres@localhost:5432/qlrf?sslmode=disable
        run: go run ./scripts/seed-e2e-data

      - name: Install UI dependencies
        working-directory: ui/control-tower
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ui/control-tower
        run: npx playwright install --with-deps chromium

      # Seeded-stack specs, expanded one page at a time (E2E-001 overview,
      # E2E-002 sites, E2E-003 drift, E2E-004 images, E2E-005 risk). Playwright
      # runs in CI mode (webServer disabled) and targets the compose UI on
      # :3000. New pages get added to this list as their specs are hardened.
      - name: Run Playwright tests (seeded pages)
        working-directory: ui/control-tower
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          E2E_CLERK_USER_USERNAME: ${{ secrets.E2E_CLERK_USER_USERNAME }}
          E2E_CLERK_USER_PASSWORD: ${{ secrets.E2E_CLERK_USER_PASSWORD }}
        run: npm run test:e2e:chromium -- e2e/overview.spec.ts e2e/sites.spec.ts e2e/drift.spec.ts e2e/images.spec.ts e2e/risk.spec.ts

      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: ui/control-tower/playwright-report/
          retention-days: 7

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results
          path: ui/control-tower/test-results/
          retention-days: 7

      - name: Tear down stack
        if: always()
        run: docker compose down -v

  # =============================================================================
  # Docker Images
  # =============================================================================
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [go-build, frontend-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        include:
          - service: api
            context: .
            dockerfile: services/api/Dockerfile
          - service: orchestrator
            context: .
            dockerfile: services/orchestrator/Dockerfile
          - service: connectors
            context: .
            dockerfile: services/connectors/Dockerfile
          - service: drift
            context: .
            dockerfile: services/drift/Dockerfile
          - service: ui
            context: ui/control-tower
            dockerfile: ui/control-tower/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/ql-rf-${{ matrix.service }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.sha }}
            NEXT_PUBLIC_API_URL=https://api.quantumlayer.dev
            NEXT_PUBLIC_ORCHESTRATOR_URL=https://api.quantumlayer.dev

  # =============================================================================
  # Security Scanning
  # =============================================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # =============================================================================
  # Summary
  # =============================================================================
  ci-complete:
    name: CI Complete
    runs-on: ubuntu-latest
    needs: [go-build, frontend-build, frontend-e2e, security-scan]
    if: always()
    steps:
      - name: Check status
        run: |
          # frontend-e2e is intentionally NOT gated here: it is advisory until
          # E2E-001 (seeded full-stack E2E) lands. It still runs and is visible,
          # but its result must not block the pipeline. See the frontend-e2e job.
          if [ "${{ needs.go-build.result }}" != "success" ] || \
             [ "${{ needs.frontend-build.result }}" != "success" ] || \
             [ "${{ needs.security-scan.result }}" != "success" ]; then
            echo "CI failed"
            exit 1
          fi
          echo "CI passed successfully (frontend-e2e advisory: ${{ needs.frontend-e2e.result }})"
