name: Build & Push Images

# The repo had no image-build CI (ci.yml = tests, cd.yml = deploy-only to the
# now-dead Azure clusters). Original images were pushed by hand to an ACR that
# no longer exists. This builds all service + UI images for linux/amd64 (Hetzner)
# and pushes them to GHCR under the repo owner, on every push to main and on
# manual dispatch.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "services/**"
      - "ui/**"
      - "pkg/**"
      - "go.*"
      - ".github/workflows/build-images.yml"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: api, context: ., file: services/api/Dockerfile }
          - { name: orchestrator, context: ., file: services/orchestrator/Dockerfile }
          - { name: connectors, context: ., file: services/connectors/Dockerfile }
          - { name: drift, context: ., file: services/drift/Dockerfile }
          - { name: cve-aggregator, context: ., file: services/cve-aggregator/Dockerfile }
          - { name: ui, context: ui/control-tower, file: ui/control-tower/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push ql-rf-${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ql-rf-${{ matrix.name }}:main
            ghcr.io/${{ github.repository_owner }}/ql-rf-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=ql-rf-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=ql-rf-${{ matrix.name }}
